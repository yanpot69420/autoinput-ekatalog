[project]
name = "inaproc-autoinput"
version = "0.1.0"
description = "Aplikasi jendela untuk menginput produk ke Katalog Elektronik v6 (INAPROC) dari satu template Excel universal"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inaproc-autoinput = "inaproc_autoinput.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
